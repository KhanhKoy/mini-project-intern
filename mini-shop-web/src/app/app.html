<div class="app-container">
  <header>
    <h1>🛒 Mini Shop</h1>
    <nav>
      <a routerLink="/products" routerLinkActive="active">Sản phẩm</a>
      <a routerLink="/categories" routerLinkActive="active">Danh mục</a>
      <a routerLink="/cart" routerLinkActive="active">Giỏ hàng</a>
      <a routerLink="/orders" routerLinkActive="active">Đơn hàng</a>

      @if (!isLoggedIn()) {
        <a routerLink="/login" routerLinkActive="active">Đăng nhập</a>
        <a routerLink="/register" routerLinkActive="active">Đăng ký</a>
      } @else {
        <div class="user-menu" (click)="toggleUserMenu()">
          <div class="avatar" [title]="currentUser()?.username">
            {{ currentUser()?.username?.charAt(0)?.toUpperCase() || 'U' }}
          </div>
          @if (isUserMenuOpen()) {
            <ul class="dropdown-menu">
              <li>
                <a routerLink="/profile" (click)="toggleUserMenu()">Thông tin người dùng</a>
              </li>
              <li>
                <button (click)="logout()">Đăng xuất</button>
              </li>
            </ul>
          }
        </div>
      }
    </nav>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>

  <footer>
    <!-- <p>&copy; 2026 Mini Shop. Powered by Angular & ASP.NET Core</p> -->
  </footer>
</div>
